name: Test and publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub configuration
        id: configured
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USER }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Docker Hub publishing is waiting for DOCKERHUB_USER and DOCKERHUB_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.configured.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.configured.outputs.ready == 'true'
      - uses: docker/login-action@v3
        if: steps.configured.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.configured.outputs.ready == 'true'
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USER }}/nachklang
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        if: steps.configured.outputs.ready == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
